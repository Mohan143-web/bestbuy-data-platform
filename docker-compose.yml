name: bestbuy-data-platform

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic orders --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic pricing --partitions 2 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic clickstream --partitions 4 --replication-factor 1

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  generator:
    build: .
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    profiles: ["stream"]
    command:
      [
        "python",
        "kafka-producer/producer.py",
        "--bootstrap-server",
        "kafka:9092",
        "--rate-per-second",
        "${EVENT_RATE_PER_SECOND:-5}",
      ]

  spark-master:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./:/opt/spark/app
      - ./lakehouse:/opt/spark/lakehouse
      - ./checkpoints:/opt/spark/checkpoints

  spark-worker:
    image: bitnami/spark:3.5
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ./:/opt/spark/app
      - ./lakehouse:/opt/spark/lakehouse
      - ./checkpoints:/opt/spark/checkpoints

  streaming-job:
    image: bitnami/spark:3.5
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    profiles: ["stream"]
    working_dir: /opt/spark/app
    volumes:
      - ./:/opt/spark/app
      - ./lakehouse:/opt/spark/lakehouse
      - ./checkpoints:/opt/spark/checkpoints
    command:
      [
        "spark-submit",
        "--master",
        "spark://spark-master:7077",
        "--packages",
        "io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1",
        "spark-streaming/jobs/streaming_pipeline.py",
        "--bootstrap-servers",
        "kafka:9092",
        "--lakehouse-root",
        "/opt/spark/lakehouse",
        "--checkpoint-root",
        "/opt/spark/checkpoints",
      ]

  superset:
    image: apache/superset:4.0.2
    profiles: ["dashboard"]
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: local-dev-only-change-me
    volumes:
      - ./dashboards/superset:/app/dashboard-import
    command:
      [
        "/bin/bash",
        "-lc",
        "superset db upgrade && superset fab create-admin --username admin --firstname BestBuy --lastname Demo --email admin@example.com --password admin || true && superset init && superset run -h 0.0.0.0 -p 8088",
      ]

